[project]
name = "dano-bot"
version = "0.1.0"
description = "A modular and open-source Telegram bot for Dano Academy"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiogram",
    "alembic",
    "aiosqlite",
    "asyncpg",
    "pydantic-settings",
    "sqlmodel",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "ty>=0.0.78",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ty]
# Astral's Python type checker (same toolchain vendor as uv/ruff).
# CI runs `uv run ty check app`. The per-file overrides below cover
# pre-existing third-party typing limitations only; narrowing them would
# require changing handler/database-layer logic, which is out of scope.

[[tool.ty.overrides]]
include = ["app/database/repositories.py"]

[tool.ty.overrides.rules]
# SQLModel exposes column operators on model attributes that its
# annotations do not describe (e.g. `.desc()`, `func.count()`).
unresolved-attribute = "ignore"
invalid-assignment = "ignore"
invalid-argument-type = "ignore"

[[tool.ty.overrides]]
include = [
    "app/router/admin/handlers.py",
    "app/router/admin/content/handlers.py",
]

[tool.ty.overrides.rules]
# aiogram types event payloads more strictly than the runtime guarantees
# relied on here (optional Bot, Message|InaccessibleMessage unions,
# Optional datetimes); narrowing would change handler logic.
unresolved-attribute = "ignore"
